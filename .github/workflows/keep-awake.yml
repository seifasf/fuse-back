# Backup pinger while the API is still on Render free, or during Starter outages.
# GitHub cron is often late on free accounts, so this alone is not enough for 24/7 uptime.
# Prefer Render Starter, or a punctual external monitor (cron-job.org) every 5 minutes.
name: Keep API awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-api-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        run: |
          curl --fail --silent --show-error --max-time 90 \
            --retry 3 --retry-delay 8 --retry-all-errors \
            -o /dev/null -w "status %{http_code} in %{time_total}s\n" \
            https://fuse-back-sn70.onrender.com/api/health
