# Render's free plan sleeps the API after 15 idle minutes; the next visitor then waits 20-60s.
# Pinging the database-free health endpoint every 5 minutes keeps it awake.
# GitHub may start scheduled runs a few minutes late, and pauses them after 60 days without
# repository activity (re-enable from the Actions tab).
name: Keep API awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        run: |
          curl --fail --silent --show-error --max-time 90 \
            --retry 2 --retry-delay 10 --retry-all-errors \
            -o /dev/null -w "status %{http_code} in %{time_total}s\n" \
            https://fuse-back-sn70.onrender.com/api/health
