# Render Blueprint — FUSE API
# Dashboard: New ? Blueprint ? connect fuse-back repo
# Database: MongoDB Atlas (set MONGODB_URI). Not using Render Postgres.

services:
  - type: web
    name: fuse-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: QR_SECRET
        generateValue: true
      - key: ADMIN_SECURITY_KEY
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: JWT_EXPIRES_IN
        value: "7d"
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: PAYMOB_API_KEY
        sync: false
      - key: PAYMOB_INTEGRATION_ID
        sync: false
      - key: MYFATOORAH_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM_ADDRESS
        value: fuse.contact@fuseevents.net
      - key: EMAIL_FROM_NAME
        value: FUSE Events
      - key: EMAIL_REPLY_TO
        value: fuse.contact@fuseevents.net
      - key: EMAIL_NOTIFY_TO
        sync: false
